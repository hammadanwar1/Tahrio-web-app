# One-click deploy on Render (https://render.com/deploy): storefront, admin panel and API in one
# service. The disk keeps the JSON database and uploaded photos across deploys.
services:
  - type: web
    name: tahrio
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # your live domain, e.g. https://tahrio.pk
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: REVALIDATE_SECRET
        generateValue: true
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false # password for /admin/login
      - key: DATA_DIR
        value: /var/data
    disk:
      name: tahrio-data
      mountPath: /var/data
      sizeGB: 1
