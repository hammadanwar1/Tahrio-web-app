# Render Blueprint for the API only (the website + admin panel run on Vercel).
# Render → New → Blueprint → pick this repo. The disk keeps the JSON database and uploaded photos
# across deploys and restarts (disks need a paid plan; on the free plan data resets on every deploy).
services:
  - type: web
    name: tahrio-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true # copy this into Vercel as TAHRIO_ADMIN_KEY
      - key: DATA_DIR
        value: /var/data
    disk:
      name: tahrio-data
      mountPath: /var/data
      sizeGB: 1
